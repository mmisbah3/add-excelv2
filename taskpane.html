<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excel Translator ID-EN</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 16px;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
    }
    .badge {
      display: inline-block;
      background-color: #e1dfdd;
      color: #107c41;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #107c41;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .radio-group {
      background: #fff;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .radio-option {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .radio-option:last-child {
      margin-bottom: 0;
    }
    .radio-option input {
      margin-right: 8px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #107c41;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background-color: #0b5c30;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      min-height: 18px;
    }
    .success { color: #107c41; }
    .error { color: #d83b01; }
  </style>
</head>
<body>
  <div class="badge">🇮🇩 ID &rarr; 🇬🇧 EN</div>
  <h2>Penerjemah Indonesia - Inggris</h2>
  
  <div class="form-group">
    <label>Posisi Hasil Terjemahan:</label>
    <div class="radio-group">
      <label class="radio-option">
        <input type="radio" name="position" value="inline" checked>
        Di Samping: <code>Teks (English)</code>
      </label>
      <label class="radio-option">
        <input type="radio" name="position" value="newline">
        Di Bawah: <code>Teks [Baris Baru] (English)</code>
      </label>
    </div>
  </div>

  <div class="form-group">
    <label>Cakupan:</label>
    <div class="radio-group">
      <label class="radio-option">
        <input type="radio" name="scope" value="selection">
        Sel yang dipilih saja
      </label>
      <label class="radio-option">
        <input type="radio" name="scope" value="sheet" checked>
        Seluruh sheet aktif
      </label>
      <label class="radio-option">
        <input type="radio" name="scope" value="workbook">
        Seluruh workbook
      </label>
    </div>
  </div>

  <div class="form-group">
    <label>Yang diterjemahkan:</label>
    <div class="radio-group">
      <label class="radio-option"><input type="checkbox" id="optCells" checked> Isi sel</label>
      <label class="radio-option"><input type="checkbox" id="optShapes" checked> Shape &amp; kotak teks</label>
      <label class="radio-option"><input type="checkbox" id="optCharts" checked> Judul grafik &amp; sumbu</label>
      <label class="radio-option"><input type="checkbox" id="optComments" checked> Komentar &amp; catatan</label>
    </div>
  </div>

  <button id="translateBtn">Terjemahkan ke Inggris</button>
  
  <div id="status"></div>

  <script src="taskpane.js"></script>
</body>
</html>
